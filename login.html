<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirjaudu — Tuntiseuranta</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #faf7f2;
      --surface:  #ffffff;
      --bg3:      #ede4d8;
      --border:   #e0d4c4;
      --text:     #2a1f14;
      --muted:    #6b4f38;
      --accent:   #d97706;
      --accent2:  #b45309;
      --danger:   #dc2626;
      --danger-bg:#fee2e2;
      --shadow:   0 1px 4px rgba(100,60,20,0.08);
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 340px;
    }

    .login-card h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .login-card p.sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      padding: 9px 11px;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      width: 100%;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #000;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.25rem;
    }
    button:hover { background: var(--accent2); border-color: var(--accent2); }
    button:disabled { opacity: 0.5; cursor: default; }

    .error-msg {
      display: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      font-size: 12.5px;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>Tuntiseuranta</h1>
    <p class="sub">KIRJAUDU SISÄÄN</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <label for="email">Sähköposti</label>
      <input type="email" id="email" autocomplete="username" required>

      <label for="password">Salasana</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" id="loginBtn">Kirjaudu</button>
    </form>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.classList.remove('show');

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Kirjaudutaan…';

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    errorMsg.textContent = 'Kirjautuminen epäonnistui: väärä sähköposti tai salasana.';
    errorMsg.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Kirjaudu';
    return;
  }

  // Kirjautuminen onnistui → tunnit-sivulle
  window.location.href = 'tunnit.html';
});

// Jos on jo kirjautunut sisään, ohjataan suoraan eteenpäin
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = 'tunnit.html';
})();
</script>

</body>
</html>
